name: Build Windows distribution
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  project: openvt-delta
  
jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Setup SCons
        run: python -m pip install scons==4.10.1
      - name: Cache patched Windows engine
        id: engine-cache
        uses: actions/cache@v6
        with:
          key: godot-windows-4.7.1-${{ hashFiles('thirdparty/ayagami/patches/*', 'build_godot_windows.ps1') }}
          path: bin/godot
      - name: Build patched editor and release template
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: ./build_godot_windows.ps1
      - name: Resolve pinned dependency revisions
        id: dependency-revisions
        run: |
          $revisions = @('ayagami', 'godot-keylogger', 'godot-vrm') | ForEach-Object { git rev-parse "HEAD:thirdparty/$_" }
          "key=$($revisions -join '-')" >> $env:GITHUB_OUTPUT
          "rust=$((& rustc --version).Replace(' ', '-'))" >> $env:GITHUB_OUTPUT
      - name: Cache Windows addons
        id: addon-cache
        uses: actions/cache@v6
        with:
          key: addons-windows-${{ steps.dependency-revisions.outputs.key }}-${{ steps.dependency-revisions.outputs.rust }}-${{ hashFiles('build_dependencies.ps1', 'patches/keylogger-windows.patch') }}
          path: |
            addons
            license/*.md
      - name: Build Windows dependencies
        if: steps.addon-cache.outputs.cache-hit != 'true'
        run: ./build_dependencies.ps1
      - name: Cache pinned OpenSeeFace archives
        uses: actions/cache@v6
        with:
          key: openseeface-windows-${{ hashFiles('thirdparty/openseeface.json') }}
          path: bin/downloads
      - name: Export Windows release
        run: ./build_windows.ps1 -SkipDependencies
      - name: Verify Windows project
        run: |
          & ./bin/godot/godot.windows.editor.x86_64.console.exe --headless --path . --script tests/windows_smoke.gd --log-file "$PWD/bin/windows-project-smoke.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows project smoke test failed.' }
          if (Select-String -Path bin/windows-project-smoke.log -Pattern 'SCRIPT ERROR:|ERROR:' -Quiet) {
            Get-Content bin/windows-project-smoke.log -Tail 60
            throw 'Windows project smoke test reported errors.'
          }
      - name: Verify popout controls
        run: |
          & ./bin/godot/godot.windows.editor.x86_64.console.exe --headless --path . --script tests/popout_panel_test.gd --log-file "$PWD/bin/popout-test.log"
          if ($LASTEXITCODE -ne 0) { throw 'Popout controls test failed.' }
          if (Select-String -Path bin/popout-test.log -Pattern 'SCRIPT ERROR:|ERROR:' -Quiet) {
            Get-Content bin/popout-test.log -Tail 60
            throw 'Popout controls test reported errors.'
          }
      - name: Verify OpenSeeFace lifecycle
        run: |
          & ./bin/godot/godot.windows.editor.x86_64.console.exe --headless --path . --script tests/openseeface_test.gd --log-file "$PWD/bin/openseeface-test.log"
          if ($LASTEXITCODE -ne 0) { throw 'OpenSeeFace lifecycle test failed.' }
          if (Select-String -Path bin/openseeface-test.log -Pattern 'SCRIPT ERROR:|ERROR:' -Quiet) {
            Get-Content bin/openseeface-test.log -Tail 60
            throw 'OpenSeeFace lifecycle test reported errors.'
          }
      - name: Verify Live2D metadata
        run: |
          & ./bin/godot/godot.windows.editor.x86_64.console.exe --headless --path . --script tests/live2d_metadata_test.gd --log-file "$PWD/bin/live2d-metadata-test.log"
          if ($LASTEXITCODE -ne 0) { throw 'Live2D metadata test failed.' }
          if (Select-String -Path bin/live2d-metadata-test.log -Pattern 'SCRIPT ERROR:|ERROR:' -Quiet) {
            Get-Content bin/live2d-metadata-test.log -Tail 60
            throw 'Live2D metadata test reported errors.'
          }
      - name: Verify Windows release startup
        run: |
          $logPath = "$PWD/bin/windows-smoke.log"
          $release = Get-Content bin/windows/release.json -Raw | ConvertFrom-Json
          $process = Start-Process -FilePath (Join-Path "$PWD/bin/windows" $release.executable) -WorkingDirectory "$PWD/bin/windows" -ArgumentList @('--headless', '--quit-after', '90', '--log-file', ('"' + $logPath + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Windows release startup failed.' }
          if (Select-String -Path bin/windows-smoke.log -Pattern 'SCRIPT ERROR:|ERROR:' -Quiet) {
            Get-Content bin/windows-smoke.log -Tail 60
            throw 'Windows release reported errors.'
          }
      - name: Verify and package Windows distribution
        run: ./package_windows.ps1
      - name: Save Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.project }}.windows
          path: bin/OpenVT-Delta-for-Windows-x64.zip
